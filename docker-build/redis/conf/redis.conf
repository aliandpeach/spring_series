# ===== 网络 =====
# bind 0.0.0.0 + protected-mode no + requirepass 是 Docker 暴露端口的标配组合,
# 仅靠 protected-mode 会让外部连接被拒。
bind 0.0.0.0
protected-mode no
port 16379
tcp-backlog 511
tcp-keepalive 60
timeout 0

# ===== 认证 =====
requirepass Spinfo@0123

# ===== 通用 =====
# 容器内必须前台运行,docker 才能正确接管进程生命周期
daemonize no
supervised no
# pidfile 设空:daemonize=no 时不需要,且 /var/run 对 redis 用户不可写,会报 Permission denied
pidfile ""
loglevel notice
# logfile 留空走 stdout,由 docker logs 接管
logfile ""
# databases 必须 >= 1,设 0 会导致 SELECT 0 失败,几乎所有客户端连不上
databases 16

# ===== 内存 =====
# 必须 < compose 里 mem_limit,留 ~20% 给 redis 进程本身和 fork 时 COW 开销
# 当前 mem_limit=1g,这里设 800mb
maxmemory 800mb
# allkeys-lru:内存满时淘汰任意 key(LFU 更适合有明确热点访问的模式,
# 可改成 allkeys-lfu)。如果 redis 当缓存用,选 allkeys-*;当持久存储用,选 noeviction
maxmemory-policy allkeys-lru

# ===== RDB 持久化(默认策略,代价低,故障可能丢分钟级数据)=====
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ===== AOF 持久化(每秒 fsync,故障最多丢 1 秒,与 RDB 互补)=====
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ===== 慢日志 =====
# 单位微秒,10000 = 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# ===== 客户端输出缓冲区(防止某个慢客户端把 redis 内存吃爆)=====
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ===== 编码优化(小对象用紧凑编码,大量节省内存)=====
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# ===== 危险命令改名(可选,生产建议取消注释)=====
# 注意:改名后部分客户端工具(如 RedisInsight、lettuce 健康检查)可能失败,
# 需要同步调整客户端配置。
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
