version: '3.9'

services:
  mysql:
    container_name: mysql8.0.13
    image: mysql:8.0.13
    restart: always

    # MySQL 8.0 的 lower_case_table_names、字符集等必须在初始化前确定,
    # 放在 command 里随容器启动注入,保证首次 init 就生效。
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1

    ports:
      - 13306:13306

    environment:
      - MYSQL_ROOT_PASSWORD=root
      - TZ=Asia/Shanghai

    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

    # 非 swarm 模式下 deploy.resources.limits.memory 不生效,
    # 改用 mem_limit(-compose v3 仍兼容)。
    mem_limit: 2g
    memswap_limit: 2g

    volumes:
      - ./init/:/docker-entrypoint-initdb.d/
      - ./conf/my.cnf:/etc/my.cnf
      - ./mysql-files:/var/lib/mysql-files/
      - ./data:/var/lib/mysql
      #- ./mysql/log:/var/log/mysql
      #- ./mysql/tmp:/tmp

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
