services:
  es-single:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: es-single
    restart: always
    privileged: true
    environment:
      - node.name=es-single
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - TAKE_FILE_OWNERSHIP=true
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
      #- xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      #- xpack.security.transport.ssl.enabled=true
    #ulimits:
    #  memlock:
    #    soft: -1
    #    hard: -1
    volumes:
      - ./es-single/data:/usr/share/elasticsearch/data
      - ./es-single/logs:/usr/share/elasticsearch/logs
      - ./es-single/plugins:/usr/share/elasticsearch/plugins
      - ./es-single/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    networks:
      - es-test-network
    expose:
      - 19200
    ports:
      - "19200:19200"

      #  es-head:
      #    image: wallbase/elasticsearch-head:6-alpine
      #    container_name: es-head
      #    environment:
      #      TZ: 'Asia/Shanghai'
      #    networks:
      #      - es-test-network
      #    ports:
      #      - '19210:19100'
      #    expose:
      #      - 19210
      #    depends_on:
      #      - es-single

  es-kibana:
    image: docker.elastic.co/kibana/kibana:7.17.28
    container_name: es-kibana
    restart: always
    environment:
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
      - ES_USERNAME=${ES_USERNAME}
      - ES_PASSWORD=${ES_PASSWORD}
      - TZ='Asia/Shanghai'
    volumes:
      - ./es-kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
    networks:
      - es-test-network
    expose:
      - 15601
    ports:
      - '15601:15601'
    depends_on:
      - es-single



networks:
  es-test-network:
    name: es-test-network
